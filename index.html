<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>testts - Form Demo</title>
</head>
<body>
    <h1>Welcome to testts</h1>
    <form id="demo-form">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name">
        <button type="submit">Submit</button>
    </form>

    <script>
        const form = document.getElementById('demo-form');
        form.addEventListener('submit', function(event) {
            event.preventDefault();
            const nameValue = document.getElementById('name').value || 'User';
            console.log(`Form submitted successfully by ${nameValue}`);
            alert(`Form submitted successfully by ${nameValue}`);
        });
    </script>
</body>
</html>
